[project]
name = "evecsm-example"
version = "0.1.0"
description = "Example EvE Conduit module: Tranquility server status. Copy it to start your own module."
requires-python = ">=3.12"
dependencies = ["evecsm>=0.1"]

[project.entry-points."evecsm.modules"]
example = "evecsm_example.module:ExampleModule"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evecsm_example*"]

[tool.setuptools.package-data]
evecsm_example = ["static/**/*"]

# EvE Conduit site for nginx.
# Debian/Ubuntu: /etc/nginx/sites-available/conduit.conf (+ symlink in sites-enabled)
# RHEL family:   /etc/nginx/conf.d/conduit.conf
# Replace auth.example.com below, then add HTTPS with: certbot --nginx -d auth.example.com

upstream conduit_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name auth.example.com;

    root /var/www/conduit/web;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Browsers check back on every load (a quick 304 when nothing changed), so updates show up at once.
    expires -1;

    # Let's Encrypt's checks for an IP address certificate (install.sh --domain <IPv4 address>).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/conduit/acme;
        default_type text/plain;
    }

    # Django static files (collectstatic), including plugin front ends.
    location /static/ {
        alias /var/www/conduit/static/;
        access_log off;
    }

    # Optional: only let trusted addresses reach the Django back-office (or set CONDUIT_DJANGO_ADMIN=false).
    # location /django-admin/ {
    #     allow 203.0.113.10;   # your address
    #     deny all;
    #     proxy_pass http://conduit_app;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # API, EVE login and the back-office go to the application.
    location ~ ^/(api|sso|django-admin)/ {
        proxy_pass http://conduit_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Everything else is the single-page app.
    location / {
        try_files $uri /index.html;
    }
    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
}

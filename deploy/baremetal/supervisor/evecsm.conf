; EVECSM services for Supervisor.
; Debian/Ubuntu: /etc/supervisor/conf.d/evecsm.conf    RHEL family: /etc/supervisord.d/evecsm.ini
; Manage with: sudo evecsm status | restart   (or supervisorctl status evecsm:*)

[program:web]
command=/usr/local/bin/evecsm run web
user=evecsm
directory=/opt/evecsm
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/evecsm/web.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:worker]
command=/usr/local/bin/evecsm run worker
user=evecsm
directory=/opt/evecsm
autostart=true
autorestart=true
startsecs=10
; Let running ESI syncs finish before stopping.
stopwaitsecs=600
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/evecsm/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:beat]
command=/usr/local/bin/evecsm run beat
user=evecsm
directory=/opt/evecsm
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/evecsm/beat.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[group:evecsm]
programs=web,worker,beat
priority=999

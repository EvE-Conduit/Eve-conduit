; EvE Conduit services for Supervisor.
; Debian/Ubuntu: /etc/supervisor/conf.d/conduit.conf    RHEL family: /etc/supervisord.d/conduit.ini
; Manage with: sudo conduit status | restart   (or supervisorctl status conduit:*)

[program:web]
command=/usr/local/bin/conduit run web
user=conduit
directory=/opt/conduit
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/conduit/web.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:worker]
command=/usr/local/bin/conduit run worker
user=conduit
directory=/opt/conduit
autostart=true
autorestart=true
startsecs=10
; Let running ESI syncs finish before stopping.
stopwaitsecs=600
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/conduit/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:beat]
command=/usr/local/bin/conduit run beat
user=conduit
directory=/opt/conduit
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/conduit/beat.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[group:conduit]
programs=web,worker,beat
priority=999

# Copy .env.example to .env, fill it in, then: docker compose up -d --build
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: conduit-backend
  env_file: .env
  environment:
    DATABASE_URL: postgres://conduit:${POSTGRES_PASSWORD}@db:5432/conduit
    REDIS_URL: redis://redis:6379/0
    # Docker installs update with git pull + docker compose up -d --build; the site only shows the changelog.
    CONDUIT_INSTALL_KIND: docker
    # The SeAT import program uploads through web; the worker imports from the same folder.
    CONDUIT_SEAT_IMPORT_DIR: /srv/seat-import
  volumes:
    - seat_import:/srv/seat-import
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  web:
    <<: *backend
    command: web

  worker:
    <<: *backend
    command: worker
    depends_on: [web]

  beat:
    <<: *backend
    command: beat
    depends_on: [web]

  caddy:
    build: ./frontend
    image: conduit-frontend
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on: [web]
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    # Postgres's stock settings suit a laptop. Sized here for a small server; see "Sizing" in .env.example.
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=2GB
      - -c
      - random_page_cost=1.1
      # Syncs rewrite the same tables all day: vacuum them little and often.
      - -c
      - autovacuum_naptime=30s
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
      - -c
      - autovacuum_vacuum_cost_limit=1000
    shm_size: 256mb
    environment:
      POSTGRES_DB: conduit
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  caddy_data:
  seat_import:

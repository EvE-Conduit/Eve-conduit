name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "backend[dev]" -e plugins/conduit-example -e plugins/conduit-moons -e plugins/conduit-recruitment -e plugins/conduit-srp -e plugins/conduit-discord -e plugins/conduit-announcements -e plugins/conduit-fleets -e plugins/conduit-skillplans -e plugins/conduit-doctrines -e plugins/conduit-mentors -e plugins/conduit-buyback
      - run: python -m pytest -q
        working-directory: backend
      - name: Plugin tests
        run: python -m pytest -q -c pyproject.toml --rootdir . ../plugins/conduit-moons/tests ../plugins/conduit-recruitment/tests ../plugins/conduit-srp/tests ../plugins/conduit-discord/tests ../plugins/conduit-announcements/tests ../plugins/conduit-fleets/tests ../plugins/conduit-skillplans/tests ../plugins/conduit-doctrines/tests ../plugins/conduit-mentors/tests ../plugins/conduit-buyback/tests
        working-directory: backend
      - name: No missing migrations
        run: CONDUIT_DEBUG=1 python manage.py makemigrations --check --dry-run
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  release-files:
    # Builds the release zip so the Windows jobs below can test the installer against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: bash windows/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/eve-conduit-*

  windows:
    needs: release-files
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell tests
        shell: pwsh
        run: |
          # The real VC++ redistributable, so the runtime-unpacking test runs with expand.exe instead of being skipped.
          $env:CONDUIT_TEST_VCREDIST = Join-Path $env:RUNNER_TEMP 'vc_redist.x64.exe'
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile $env:CONDUIT_TEST_VCREDIST
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
          ./windows/tests/run-tests.ps1
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Build the installer
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/eve-conduit-*-windows.zip | Select-Object -First 1
          ./windows/installer/build.ps1 -Zip $zip.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/EvE-Conduit-Setup-*.exe

  windows-install:
    # A real install, the way the setup wizard runs it: Windows PowerShell 5.1 with its output captured. Then the
    # site must answer, and the uninstaller must remove everything.
    needs: release-files
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      # Windows PowerShell 5.1 itself (as the setup wizard uses), not started from PowerShell 7, whose module
      # path would leak into it.
      - name: Install
        shell: powershell
        run: |
          $zip = Get-ChildItem dist/eve-conduit-*-windows.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath release
          $installer = (Get-ChildItem release -Directory | Select-Object -First 1).FullName + '\windows\install.ps1'
          $argList = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $installer, '-Yes', '-Domain', 'localhost',
            '-Email', 'ci@example.com', '-NoTls', '-NoTray', '-InstallRoot', 'C:\EvE-Conduit', '-HttpPort', '8080',
            '-PublicPorts', 'AsChosen', '-ResultFile', "$env:RUNNER_TEMP\result.txt")
          $p = Start-Process powershell.exe -ArgumentList $argList -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput install.log -RedirectStandardError install.err
          Get-Content install.log, install.err
          if ($p.ExitCode -ne 0) { throw "install.ps1 exited with $($p.ExitCode)" }
          Get-Content "$env:RUNNER_TEMP\result.txt"
      - name: The site answers
        shell: pwsh
        run: |
          Get-Service conduit-* | Format-Table Name, Status
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            try { $r = Invoke-WebRequest http://localhost:8080/api/core/bootstrap -UseBasicParsing; $ok = $r.StatusCode -eq 200 } catch { Start-Sleep 5 }
          }
          if (-not $ok) { Get-ChildItem C:\EvE-Conduit\logs | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 40 }; throw 'The site never answered' }
          ($r.Content | ConvertFrom-Json).site | Format-List name, version
          if (-not (Get-ScheduledTask -TaskName 'EvE Conduit updater' -ErrorAction SilentlyContinue)) { throw 'The updater task is missing' }
      - name: Uninstall
        if: always()
        shell: powershell
        run: |
          if (-not (Test-Path C:\EvE-Conduit\uninstall.ps1)) { Write-Host 'Nothing installed to remove.'; exit 0 }
          & C:\EvE-Conduit\uninstall.ps1 -Mode All -Yes -NoBackup
          if (Get-Service conduit-* -ErrorAction SilentlyContinue) { throw 'Services are left behind' }
          if (Test-Path C:\EvE-Conduit) { throw 'The install folder is left behind' }

[project]
name = "conduit"
version = "0.4.0"
description = "Self-hosted EVE Online auth and management platform with a module system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.2",
    "django-ninja>=1.4",
    "celery[redis]>=5.5",
    "redis>=5",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "cryptography>=44",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.3",
    "whitenoise>=6.9",
    "gunicorn>=26",
]

[project.optional-dependencies]
# MariaDB/MySQL driver. Needs a C compiler and the MariaDB client headers (build-essential, libmariadb-dev).
mysql = ["mysqlclient>=2.2"]
dev = ["pytest>=8", "pytest-django>=4.9"]

[project.entry-points."conduit.plugins"]
# First-party modules register here exactly like third-party ones, e.g.:
# skills = "conduit_skills.module:SkillsModule"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["conduit*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
filterwarnings = ["ignore:No directory at:UserWarning"]

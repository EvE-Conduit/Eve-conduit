[project]
name = "conduit-tracking"
version = "1.0.0"
description = "Activity Tracking: follow a member and all their alts for 1 to 60 days, with a report of the systems they were in, the ships they flew, what they earned and when they played."
authors = [{ name = "EvE Conduit" }]
requires-python = ">=3.12"
# The EvE Conduit version it needs is [tool.conduit] min_conduit (checked before installing).
dependencies = ["conduit"]

[project.entry-points."conduit.plugins"]
tracking = "conduit_tracking.plugin:TrackingPlugin"

# How the plugin appears in the catalog (Administration -> Plugins -> Browse). See ../scripts/build_catalog.py.
[tool.conduit]
name = "Activity Tracking"
icon = "radar"
category = "HR"
min_conduit = "0.5.55"
esi_scopes = ["esi-location.read_location.v1", "esi-location.read_online.v1", "esi-location.read_ship_type.v1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["conduit_tracking*"]

[tool.setuptools.package-data]
conduit_tracking = ["static/**/*"]

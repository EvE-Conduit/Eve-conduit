[project]
name = "conduit-spycheck"
version = "1.0.1"
description = "Spy Check: a daily scan of members' synced data for dealings with blacklisted and watched characters, corporations and alliances, with findings HR reviews."
authors = [{ name = "EvE Conduit" }]
requires-python = ">=3.12"
# The EvE Conduit version it needs is [tool.conduit] min_conduit (checked before installing).
dependencies = ["conduit"]

[project.entry-points."conduit.plugins"]
spycheck = "conduit_spycheck.plugin:SpyCheckPlugin"

# How the plugin appears in the catalog (Administration -> Plugins -> Browse). See ../scripts/build_catalog.py.
[tool.conduit]
name = "Spy Check"
icon = "radar"
category = "HR"
min_conduit = "0.5.52"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["conduit_spycheck*"]

[tool.setuptools.package-data]
conduit_spycheck = ["static/**/*"]

[project]
name = "conduit-freight"
version = "1.0.2"
description = "Freight: routes with your rates, a calculator that gives the exact courier contract to make, and every courier contract checked against its route."
authors = [{ name = "EvE Conduit" }]
requires-python = ">=3.12"
# The EvE Conduit version it needs is [tool.conduit] min_conduit (checked before installing).
dependencies = ["conduit"]

[project.entry-points."conduit.plugins"]
freight = "conduit_freight.plugin:FreightPlugin"

# How the plugin appears in the catalog (Administration -> Plugins -> Browse). See ../scripts/build_catalog.py.
[tool.conduit]
name = "Freight"
icon = "truck"
category = "Industry"
min_conduit = "0.5.55"
esi_scopes = ["esi-contracts.read_character_contracts.v1", "esi-contracts.read_corporation_contracts.v1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["conduit_freight*"]

[tool.setuptools.package-data]
conduit_freight = ["static/**/*"]

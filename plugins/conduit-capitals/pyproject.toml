[project]
name = "conduit-capitals"
version = "1.0.0"
description = "Capital Registry: who can fly and who owns each capital class, where the hulls are parked, jump skills and clones, and members marking hulls available for ops."
authors = [{ name = "EvE Conduit" }]
requires-python = ">=3.12"
# The EvE Conduit version it needs is [tool.conduit] min_conduit (checked before installing).
dependencies = ["conduit"]

[project.entry-points."conduit.plugins"]
capitals = "conduit_capitals.plugin:CapitalsPlugin"

# How the plugin appears in the catalog (Administration -> Plugins -> Browse). See ../scripts/build_catalog.py.
[tool.conduit]
name = "Capital Registry"
icon = "anchor"
category = "Military"
min_conduit = "0.5.52"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["conduit_capitals*"]

[tool.setuptools.package-data]
conduit_capitals = ["static/**/*"]

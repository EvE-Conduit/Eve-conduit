[project]
name = "conduit-mumble"
version = "1.0.0"
description = "Mumble: members get a Mumble account with groups from their groups and state, and anyone with the permission can hand out temporary access links to guests."
authors = [{ name = "EvE Conduit" }]
requires-python = ">=3.12"
# The EvE Conduit version it needs is [tool.conduit] min_conduit (checked before installing).
dependencies = ["conduit"]

[project.entry-points."conduit.plugins"]
mumble = "conduit_mumble.plugin:MumblePlugin"

# How the plugin appears in the catalog (Administration -> Plugins -> Browse). See ../scripts/build_catalog.py.
[tool.conduit]
name = "Mumble"
icon = "mic"
category = "Communication"
min_conduit = "0.5.22"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["conduit_mumble*"]

[tool.setuptools.package-data]
conduit_mumble = ["static/**/*", "authenticator/*"]

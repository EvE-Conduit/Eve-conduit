[project]
name = "conduit-blacklist"
version = "1.0.0"
description = "Blacklist: characters, corporations and alliances you don't want, with notes, and a warning when one links a character or applies."
authors = [{ name = "EvE Conduit" }]
requires-python = ">=3.12"
# The EvE Conduit version it needs is [tool.conduit] min_conduit (checked before installing).
dependencies = ["conduit"]

[project.entry-points."conduit.plugins"]
blacklist = "conduit_blacklist.plugin:BlacklistPlugin"

# How the plugin appears in the catalog (Administration -> Plugins -> Browse). See ../scripts/build_catalog.py.
[tool.conduit]
name = "Blacklist"
icon = "shield"
category = "HR"
min_conduit = "0.5.51"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["conduit_blacklist*"]

[tool.setuptools.package-data]
conduit_blacklist = ["static/**/*"]

[project]
name = "conduit-inactivity"
version = "1.0.0"
description = "Inactivity: members who have gone quiet, from site sign-ins, game logins and fleets, and leave of absence so nobody is chased by mistake."
authors = [{ name = "EvE Conduit" }]
requires-python = ">=3.12"
# The EvE Conduit version it needs is [tool.conduit] min_conduit (checked before installing).
dependencies = ["conduit"]

[project.entry-points."conduit.plugins"]
inactivity = "conduit_inactivity.plugin:InactivityPlugin"

# How the plugin appears in the catalog (Administration -> Plugins -> Browse). See ../scripts/build_catalog.py.
[tool.conduit]
name = "Inactivity"
icon = "moon"
category = "HR"
min_conduit = "0.5.52"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["conduit_inactivity*"]

[tool.setuptools.package-data]
conduit_inactivity = ["static/**/*"]
